name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install, typecheck, build, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # The lockfile and exact dev dependencies target DSH 0.1.7-rc.1.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack
        run: pnpm pack --pack-destination .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-side-chat-plus-${{ matrix.node-version }}
          path: |
            dsh-side-chat-plus-*.tgz
            lib/
          if-no-files-found: ignore
