packages:
  - .

# Build against a local DeepSeek Harness checkout instead of the published
# registry line: DSH ships 0.1.2 as a source release, and the plugin tracks
# APIs that only exist there (and drops packages 0.1.2 removed).
# Keep one entry per @deepseek-ai/dsh-* dependency in package.json.
#
# MACHINE-SPECIFIC: these are absolute paths to one local checkout. On another
# machine, either point them at your own clone or comment the whole `overrides`
# block out and delete pnpm-lock.yaml — the version ranges in package.json then
# resolve from the registry (0.1.1-rc.2 is the newest published line).
overrides:
  '@deepseek-ai/dsh-agent': link:D:/code/deepseek-harness/packages/core/agent
  '@deepseek-ai/dsh-attachment': link:D:/code/deepseek-harness/packages/attachment/attachment
  '@deepseek-ai/dsh-client-locale': link:D:/code/deepseek-harness/packages/client/locale
  '@deepseek-ai/dsh-client-ui-conversation': link:D:/code/deepseek-harness/packages/client/ui-conversation
  '@deepseek-ai/dsh-client-ui-primitives': link:D:/code/deepseek-harness/packages/client/ui-primitives
  '@deepseek-ai/dsh-client-ui-renderer': link:D:/code/deepseek-harness/packages/client/ui-renderer
  '@deepseek-ai/dsh-client-ui-settings': link:D:/code/deepseek-harness/packages/client/ui-settings
  '@deepseek-ai/dsh-client-ui-slots': link:D:/code/deepseek-harness/packages/client/ui-slots
  '@deepseek-ai/dsh-home-paths': link:D:/code/deepseek-harness/packages/util/home-paths
  '@deepseek-ai/dsh-host-webserver': link:D:/code/deepseek-harness/packages/host/webserver
  '@deepseek-ai/dsh-llm': link:D:/code/deepseek-harness/packages/llm/llm
  '@deepseek-ai/dsh-session': link:D:/code/deepseek-harness/packages/core/session
  '@deepseek-ai/dsh-session-query': link:D:/code/deepseek-harness/packages/session-query/session-query
  '@deepseek-ai/dsh-workspace': link:D:/code/deepseek-harness/packages/workspace/workspace
  '@deepseek-ai/dsh-permission-presets': link:D:/code/deepseek-harness/packages/interaction/permission-presets
  '@deepseek-ai/dsh-sandbox-policy': link:D:/code/deepseek-harness/packages/sandbox/sandbox-policy
  '@deepseek-ai/dsh-agent-presets': link:D:/code/deepseek-harness/packages/preset/agent-presets
  '@deepseek-ai/dsh-settings': link:D:/code/deepseek-harness/packages/settings/settings
  '@deepseek-ai/dsh-api-session-controller': link:D:/code/deepseek-harness/packages/api/session-controller
